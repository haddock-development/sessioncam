name: inspect-sdk
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ObjectCaptureSession interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          F=$(find "$SDK/System/Library/Frameworks/RealityKit.framework" -name "*.swiftinterface" | head -1)
          echo "FILE: $F"
          grep -nE "class ObjectCaptureSession|var state|func start|func finish|func startDetecting|func startCapturing|func stop|enum Status|struct Status" "$F" | head -40
          echo "--- Status enum cases ---"
          awk '/enum Status.*:/,/^    }/' "$F" | head -40
          echo "--- delegate? ---"
          grep -nE "ObjectCaptureSessionDelegate|protocol.*Delegate" "$F" | head -10
