name: inspect-sdk
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Find ObjectCaptureSession across SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FOUND=0
          for F in $(find "$SDK/System/Library/Frameworks" -name "*.swiftinterface" 2>/dev/null); do
            if grep -q "class ObjectCaptureSession" "$F" 2>/dev/null; then
              echo "FOUND IN: $F"
              grep -nE "class ObjectCaptureSession|public var state|public func start|public func finish|public func startDetecting|public func startCapturing|enum Status|Status \{|public var delegate|ObjectCaptureSessionDelegate" "$F" | head -30
              echo "--- Status cases ---"
              grep -nE "case (initializing|ready|detecting|capturing|finishing|completed|failed)" "$F" | head -12
              FOUND=1
            fi
          done
          [ "$FOUND" = "0" ] && echo "nirgends gefunden - grep ObjC Headers:"
          grep -rn "ObjectCaptureSession" "$SDK/System/Library/Frameworks" --include="*.h" 2>/dev/null | head -5
